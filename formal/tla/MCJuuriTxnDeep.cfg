\* Deep: three tracked transactions of up to four operations, two forks and
\* three watches -- too many behaviours to enumerate; run with -simulate.
CONSTANTS
    Keys <- MCKeys
    Probes <- MCProbes
    InitContents <- MCInitContents
    MaxTxns = 3
    MaxOps = 4
    Forks = 2
    MaxWatches = 3
    NIL = NIL
    NoVal = NoVal
SPECIFICATION Spec
INVARIANTS
    NoMutation
    Persistence
    OwnedUnpublished
    TxnContent
    Shape
    LeafOnCopies
    NotifyNoNil
    RecordsPublished
    NoDuplicateRecords
    LiveNotSealed
    LeftSealed
    SealedFromLineage
    KeyWatch
    MissWatch
    PrefixWatch
    NoSpuriousKeyWatch
CHECK_DEADLOCK FALSE
