\* Exhaustive: one tracked transaction of up to three operations, an untracked
\* fork from any published tree (before, between or after the tracked
\* writes, including from a frozen tree) and two key watches.
CONSTANTS
    Keys <- MCKeys
    Probes <- MCProbes
    InitContents <- MCInitContents
    MaxTxns = 1
    MaxOps = 3
    Forks = 1
    MaxWatches = 2
    NIL = NIL
    NoVal = NoVal
SPECIFICATION Spec
INVARIANTS
    NoMutation
    Persistence
    OwnedUnpublished
    TxnContent
    Shape
    LeafOnCopies
    NotifyNoNil
    RecordsPublished
    NoDuplicateRecords
    LiveNotSealed
    LeftSealed
    SealedFromLineage
    KeyWatch
    MissWatch
    PrefixWatch
    NoSpuriousKeyWatch
CHECK_DEADLOCK FALSE
