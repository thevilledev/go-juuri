\* One reader, two tracked transactions of up to two operations each (which
\* may roll back to an older tree), and an untracked fork; safety and
\* liveness. LazyWatchSafety.cfg adds a second reader.
CONSTANTS
    Readers = {r1}
    MaxTxns = 2
    MaxOps = 2
    Fork = TRUE
    Rollback = TRUE
    NIL = NIL
    SEALED = SEALED
SPECIFICATION Spec
INVARIANTS
    NoDoubleClose
    DropLeafNonNil
    VisibleNotOwned
    LeafShared
    NoLostWakeup
    RetiredSealed
    NoSpuriousWakeup
PROPERTIES
    ReadersGetChannel
    NotifiedWakes
CHECK_DEADLOCK FALSE
