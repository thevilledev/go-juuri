\* Exhaustive: two tracked transactions of up to two operations each (Freeze
\* included) and two key watches whose channels are asked for, from each
\* starting shape. MCJuuriTxnFork.cfg adds an untracked fork;
\* MCJuuriTxnDeep.cfg goes deeper, by simulation.
CONSTANTS
    Keys <- MCKeys
    Probes <- MCProbes
    InitContents <- MCInitContents
    MaxTxns = 2
    MaxOps = 2
    Forks = 0
    MaxWatches = 2
    NIL = NIL
    NoVal = NoVal
SPECIFICATION Spec
INVARIANTS
    NoMutation
    Persistence
    OwnedUnpublished
    TxnContent
    Shape
    LeafOnCopies
    NotifyNoNil
    RecordsPublished
    NoDuplicateRecords
    LiveNotSealed
    LeftSealed
    SealedFromLineage
    KeyWatch
    MissWatch
    PrefixWatch
    NoSpuriousKeyWatch
CHECK_DEADLOCK FALSE
