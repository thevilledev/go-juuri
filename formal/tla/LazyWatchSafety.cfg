\* Two readers racing each other as well as the writers, notify and the
\* fork, with rollback: safety only, too many states to enumerate on a laptop;
\* run with -simulate.
CONSTANTS
    Readers = {r1, r2}
    MaxTxns = 2
    MaxOps = 2
    Fork = TRUE
    Rollback = TRUE
    NIL = NIL
    SEALED = SEALED
SPECIFICATION Spec
INVARIANTS
    NoDoubleClose
    DropLeafNonNil
    VisibleNotOwned
    LeafShared
    NoLostWakeup
    RetiredSealed
    NoSpuriousWakeup
CHECK_DEADLOCK FALSE
