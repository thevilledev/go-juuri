name: CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0
      - name: Setup Go
        uses: actions/setup-go@4d34df0c2316fe8122ab82dc22947d607c0c91f9 # v4.0.0
        with:
          go-version: stable
      - name: Install golangci-lint
        run: make tools
      - name: Lint
        run: make lint
      - name: License headers
        run: make headers

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version:
          - '1.23' # named in go.mod
          - 'oldstable'
          - 'stable'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0
      - name: Setup Go
        uses: actions/setup-go@4d34df0c2316fe8122ab82dc22947d607c0c91f9 # v4.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test -count=1 -cover ./...
      - name: Test with the race detector
        run: go test -count=1 -race ./...
      - name: Test the pure-safe build (no package unsafe)
        run: make test-safe

  test-386:
    # 32-bit: atomic alignment, no hardware popcount.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0
      - name: Setup Go
        uses: actions/setup-go@4d34df0c2316fe8122ab82dc22947d607c0c91f9 # v4.0.0
        with:
          go-version: stable
      - name: Test (GOARCH=386)
        run: |
          GOARCH=386 go test -count=1 ./...
          GOARCH=386 go test -count=1 -tags juuri_safe ./...

  differential:
    # The nested module compares against go-immutable-radix; shared runners
    # are far too noisy to time anything on, so the benchmarks are only
    # compiled and run once.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0
      - name: Setup Go
        uses: actions/setup-go@4d34df0c2316fe8122ab82dc22947d607c0c91f9 # v4.0.0
        with:
          go-version: stable
      - name: Differential test against go-immutable-radix
        run: make diff
      - name: Fuzz smoke
        run: |
          go test ./internal/radix -run '^$' -fuzz FuzzTreeOps -fuzztime 30s
          cd radixdiff && go test . -run '^$' -fuzz FuzzDifferential -fuzztime 30s
      - name: Every benchmark runs
        run: cd radixdiff && go test -run '^$' -bench . -benchtime 1x .
